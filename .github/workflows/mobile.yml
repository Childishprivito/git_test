name: FoodLog mobile

# Checks the Expo app (typecheck + lint). Publishing for Expo Go happens on
# Expo's side via .eas/workflows/ and the GitHub connection on expo.dev;
# the EXPO_TOKEN steps below are an optional alternative. Run it by hand with
# "Build iPhone app" ticked to make a real build with Apple Health
# (needs the $99 Apple Developer account linked in Expo).
on:
  push:
    branches: [master]
    paths: ["foodlog-mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:
    inputs:
      build_ios:
        description: "Build iPhone app (TestFlight) with EAS Build"
        type: boolean
        default: false

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: foodlog-mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: foodlog-mobile/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx expo lint

      - name: Check Expo token
        id: check
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::warning::EXPO_TOKEN isn't set, so the app wasn't published. See foodlog-mobile/README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Expo Go (EAS Update)
        if: steps.check.outputs.ready == 'true'
        run: |
          npx eas-cli@25.1.1 update --branch preview --non-interactive \
            --message "$(git log -1 --pretty=%s)" | tee update.log
          {
            echo "### FoodLog published"
            echo "Open https://expo.dev, go to the foodlog project › Updates › preview, and tap **Open with Expo Go** (or scan its QR code)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build iPhone app
        if: steps.check.outputs.ready == 'true' && inputs.build_ios
        run: npx eas-cli@25.1.1 build --platform ios --profile production --non-interactive --no-wait --auto-submit
