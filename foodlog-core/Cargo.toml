[package]
name = "foodlog-core"
version = "0.1.0"
edition = "2024"
description = "Data model, sync merge and food-database parsing shared by the FoodLog app and server."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2"], optional = true }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"], optional = true }
quick-xml = { version = "0.42", optional = true }

[features]
# Reading .ods/.xlsx spreadsheets (used by the app, not the server).
import = ["dep:zip", "dep:flate2", "dep:quick-xml"]
