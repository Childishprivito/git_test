[package]
name = "foodlog-worker"
version = "0.1.0"
edition = "2024"
description = "FoodLog server on Cloudflare Workers: sync, AI estimates, USDA search. Holds the API keys."

[lib]
crate-type = ["cdylib"]

[dependencies]
foodlog-core = { path = "../foodlog-core" }
worker = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
