[package]
name = "foodlog"
version = "0.1.0"
edition = "2024"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
rxing = { version = "0.9.3", default-features = false, features = ["decoders", "oned", "no_character_set_support", "wasm_support"] }
gloo-net = { version = "0.7", default-features = false, features = ["http", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
send_wrapper = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
  "Window", "Navigator", "MediaDevices", "MediaStream", "MediaStreamTrack",
  "MediaStreamConstraints", "HtmlVideoElement", "HtmlCanvasElement",
  "CanvasRenderingContext2d", "ImageData", "Storage", "Document", "Element", "HtmlElement",
  "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

[dev-dependencies]
# Encoders let the tests draw real barcodes to decode.
rxing = { version = "0.9.3", default-features = false, features = ["decoders", "encoders", "oned", "no_character_set_support"] }
